server:
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  application:
    name: Logistic-and-Dispatch
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logistic_dispatch}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  jackson:
    time-zone: UTC

# JWT Configuration (HS256)
app:
  jwt:
    secret: ${APP_JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LXNlY3JldC1rZXktMzI=}
    issuer: logistic-dispatch-v2
    access-token-expiration-seconds: 900       # 15 minutes
    refresh-token-expiration-seconds: 604800   # 7 days
    cookie-name: refresh_token

# Springdoc OpenAPI UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
